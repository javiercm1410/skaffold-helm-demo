apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.project }}-secrets
  labels:
    app.kubernetes.io/name: {{ .Values.project }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
type: Opaque
data:
  OPENCLAW_GATEWAY_TOKEN: {{ .Values.secrets.gatewayToken | b64enc | quote }}
  TELEGRAM_BOT_TOKEN: {{ .Values.secrets.telegramBotToken | b64enc | quote }}
  LITELLM_API_KEY: {{ .Values.secrets.litellmApiKey | b64enc | quote }}
