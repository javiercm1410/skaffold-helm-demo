apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.project }}
  labels:
    app.kubernetes.io/name: {{ .Values.project }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.project }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.project }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: config-init
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              cp /config/openclaw.json /data/openclaw.json
              cp /config/AGENTS.md /data/AGENTS.md
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: openclaw-storage
              mountPath: /data
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ .Values.project }}-secrets
          ports:
            - name: http
              containerPort: {{ .Values.container.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: openclaw-storage
              mountPath: /home/node/.openclaw
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Values.project }}-config
        {{- if .Values.persistence.enabled }}
        - name: openclaw-storage
          persistentVolumeClaim:
            claimName: {{ .Values.project }}-storage
        {{- else }}
        - name: openclaw-storage
          emptyDir: {}
        {{- end }}
