replicaCount: 1

image:
  repository: ghcr.io/openclaw/openclaw
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 18789
  targetPort: 18789

container:
  port: 18789

persistence:
  enabled: true
  size: 10Gi
  storageClass: "local-path"
  accessMode: ReadWriteOnce

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

project: openclaw

litellm:
  baseUrl: "http://litellm:4000"

# Secret values — override these at deploy time or via environment-specific values
